<header class="site">

    <div class="eticheta"><img src="../assets/eticheta-rosie.png" alt="festivalul ideo ideis"></div>

    <p class="greet" id="greet" hidden></p>
    <p class="updated"><a class="plink" href="https://ideoideis.ro/proiectele/festivalul/program/" target="_blank" rel="noopener">program public ↗</a></p>

<nav class="rail" aria-label="zilele festivalului"><div class="rail-inner"><div class="rail-days" id="rail"></div><div class="rail-pins" id="railpins"></div></div></nav>

<div class="wrap">
  <div class="filters collapsed" id="filters">

    <div class="fbody">
      <input class="search" id="q" type="search" placeholder="caută: eveniment, spectacol, loc…" aria-label="caută în program">
      <div class="chiprow" id="catchips"></div>
      <p class="legend-note">click pe una sau mai multe categorii ca să vezi doar acel tip de evenimente · atinge din nou pentru tot programul</p>
    </div>
  </div>
  <main id="days"><noscript>Pagina are nevoie de JavaScript ca să afișeze programul.</noscript></main>
</div>

<button class="fab" id="fab" hidden>acum<small id="fabt"></small></button>

<script>
/* programul trupei Atelierul de Teatru: doar drumul ei prin festival + programul
   de participant (ateliere, spectacole, gale, cinematecă, petreceri).
   Logistica altor trupe nu apare; spectacolele lor da.
   Transportul e primul lucru din fiecare zi. */
window.AUD = {
  key:'trupa-atelierul',
  lockTrupa:'atelierul',
  cats:['tt','ateliere','cmt','mare','cine','parada','alt'],
  exclude:['Bootcamp MASCA'], /* școala de vară nu e pentru trupe */
  skipDays:['ma28','mi5'],
  trupePicker:false,
  compact:'trupa',
  transport:true,
  transportHero:true,
  showTech:false,
  showNeeds:false,
  greetings:{
    pre:[
      'programul vostru e gata · Alexandria vă așteaptă',
      'mai e puțin · ne vedem la Alexandria ♥',
      'trupa voastră + o săptămână de festival · în curând',
    ],
    zile:{
      mi29:['bine ați venit la #21 · locul nostru e aici'],
      j30:['prima zi de ateliere · emoțiile sunt normale'],
      v31:['a doua zi e mai ușoară decât prima. promitem.'],
      s1:['oameni pe care îi știi de 3 zile și parcă de 10 ani. matematică de festival.'],
      d2:['la ideo nu vii să vezi teatru. vii să te vezi.'],
      l3:['nu ești obosit. ești în proces de creație.'],
      ma4:['ultima zi · diseară aplaudăm tot ♥'],
    },
    post:['mulțumim · ne vedem la #22 ♥'],
  },
  sw:'../sw.js',
  info:{ contacts:false, legend:false, trupe:false, formatori:false, arteAlaturate:false, artplay:false, spectacole:true },
};
</script>
